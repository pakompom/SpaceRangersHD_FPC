name: Build and release

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'platform/**'
      - 'native/**'
      - 'tools/build.py'
      - 'tools/build_support.py'
      - 'tools/compiler.py'
      - 'tools/pascal.py'
      - 'tools/android.py'
      - 'tools/targets.py'
      - 'tests/**'
      - 'vendor/fpc'
      - 'vendor/okgf'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - '!platform/wasm/**'
      - '!platform/GameCocoaCursor.pas'
      - '!native/sdl2-wasm.patch'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'source/**'
      - 'platform/**'
      - 'native/**'
      - 'tools/build.py'
      - 'tools/build_support.py'
      - 'tools/compiler.py'
      - 'tools/pascal.py'
      - 'tools/android.py'
      - 'tools/targets.py'
      - 'tests/**'
      - 'vendor/fpc'
      - 'vendor/okgf'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - '.github/scripts/**'
      - '!platform/wasm/**'
      - '!platform/GameCocoaCursor.pas'
      - '!native/sdl2-wasm.patch'
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            platform: linux-x86_64
          - target: android
            platform: android-arm64
    env:
      CC: clang
      CXX: clang++
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore Android release key
        if: matrix.target == 'android' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ['KEYSTORE_BASE64']
          password = os.environ['KEYSTORE_PASSWORD']
          if not encoded or not password:
              raise SystemExit('Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository Actions secrets.')
          key = base64.b64decode(''.join(encoded.split()), validate=True)
          if not key:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 contains an empty keystore.')
          os.umask(0o077)
          signing = Path('build/android-signing')
          signing.mkdir(parents=True, exist_ok=True)
          (signing / 'srhd.p12').write_bytes(key)
          (signing / 'password').write_text(password)
          PY
          keytool -list -keystore build/android-signing/srhd.p12 -storepass:file build/android-signing/password > /dev/null

      - name: Install build dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          packages=(fp-compiler make cmake ninja-build pkg-config clang-18 lld-18 binutils)
          if [[ "$TARGET" == linux ]]; then
            packages+=(libsdl2-dev libogg-dev libvorbis-dev libjpeg-dev libpng-dev libxvidcore4)
          fi
          sudo apt-get install --no-install-recommends -y "${packages[@]}"
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - name: Install Android toolchain
        if: matrix.target == 'android'
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;28.2.13676358'
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358"
            echo "ANDROID_BUILD_TOOLS_VERSION=35.0.1"
            echo "JAVA_HOME=$JAVA_HOME_17_X64"
            echo "ANDROID_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))"
            echo "ANDROID_VERSION_NAME=0.1+${GITHUB_SHA:0:12}"
          } >> "$GITHUB_ENV"

      - name: Test build tooling
        run: python -m unittest discover -s tests

      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: python tools/build.py --target="$TARGET" --release

      - name: Package binaries
        env:
          TARGET: ${{ matrix.target }}
        run: python .github/scripts/package.py "$TARGET"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.platform }}
          path: .local/**/*.log
          include-hidden-files: true
          retention-days: 7

      - name: Remove Android signing material
        if: always() && matrix.target == 'android'
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('srhd.p12', 'password'):
              Path('build/android-signing', name).unlink(missing_ok=True)
          PY

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish.sh
